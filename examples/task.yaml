system_name: CMA-GFS

time:
  start_time: 2024111300
  forecast_time: 48h
  forecast_interval: 6h

plots:
  # 开关形式
  cn.h_500_psl: on
  cn.rain_24h: on

  # 参数映射形式：3 小时间隔累计降水 + 10 米风
