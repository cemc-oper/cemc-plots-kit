[build-system]
requires = ["setuptools>=64", "setuptools_scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "cemc-plots-kit"
authors = [
    {name="Wang Dapeng", email="perillaroc@gmail.com"}
]
description = "Plots tool for CEMC's NWP Opearting systems."
readme = "README.md"
keywords = ["graphic", "cemc", "cedarkit"]
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dynamic = ["version"]
classifiers = [
    "Development Status :: 3 - Alpha",

    "Intended Audience :: Developers",

    'License :: OSI Approved :: Apache Software License',

    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "pandas",
    "matplotlib",
    "xarray",
    "loguru",
    "typer",
    "PyYAML",
    "pydantic>=2,<3",
    "cedarkit-plots>=2026.9.0",
    "cedar-graph>=2026.9.0",
    "reki>=2026.9.0",
]

[project.scripts]
cemc-plots = "cemc_plots_kit.__main__:app"

[project.urls]
Homepage = "https://github.com/cemc-oper/cemc-plots-kit"
Repository = "https://github.com/cemc-oper/cemc-plots-kit.git"

[project.optional-dependencies]
test = ["pytest"]
cov = ["pytest-cov", "codecov"]

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["tests*", "docs", "example"]
namespaces = false

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
cemc_plots_kit = ["catalog/*.yaml", "schemas/*.json"]

[tool.setuptools_scm]
version_file = "src/cemc_plots_kit/_version.py"
